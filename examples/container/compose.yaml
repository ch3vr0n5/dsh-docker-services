services:
  controller:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    read_only: true
    user: "1000:1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ../controller.json:/etc/dsh-docker-services/controller.json:ro
      - controller-state:/var/lib/dsh-docker-services
      - controller-run:/run/dsh-docker-services
      - audit-checkpoint:/var/lib/dsh-audit-checkpoint
    secrets:
      - proxy-auth-key
      - audit-checkpoint-key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  controller-state: {}
  controller-run: {}
  audit-checkpoint: {}
secrets:
  proxy-auth-key:
    file: ./secrets/proxy-auth.key
  audit-checkpoint-key:
    file: ./secrets/audit-checkpoint.key
