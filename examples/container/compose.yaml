services:
  volume-init:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    entrypoint: ["/usr/local/bin/dsh-init-volumes"]
    command:
      - /var/lib/dsh-docker-services
      - /run/dsh-docker-services
      - /run/dsh-docker-services-proxy
      - /var/lib/dsh-audit-checkpoint
    read_only: true
    restart: "no"
    user: "0:0"
    network_mode: none
    volumes:
      - controller-state:/var/lib/dsh-docker-services
      - controller-run:/run/dsh-docker-services
      - proxy-run:/run/dsh-docker-services-proxy
      - audit-checkpoint:/var/lib/dsh-audit-checkpoint
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
  controller:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    read_only: true
    restart: unless-stopped
    user: "1000:1000"
    network_mode: none
    volumes:
      - /var/run/docker.sock:/run/docker.sock:rw
      - ../controller.json:/etc/dsh-docker-services/controller.json:ro
      - controller-state:/var/lib/dsh-docker-services
      - controller-run:/run/dsh-docker-services
      - audit-checkpoint:/var/lib/dsh-audit-checkpoint
    secrets:
      - proxy-auth-key
      - audit-checkpoint-key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(fs.statSync('/run/dsh-docker-services/controller.sock').isSocket()?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      volume-init:
        condition: service_completed_successfully
  proxy:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    entrypoint: ["node", "packages/proxy/lib/src/main.js"]
    command: ["/etc/dsh-docker-services/proxy.json"]
    read_only: true
    restart: unless-stopped
    user: "1000:1000"
    network_mode: none
    volumes:
      - ../proxy.json:/etc/dsh-docker-services/proxy.json:ro
      - controller-run:/run/dsh-docker-services:ro
      - proxy-run:/run/dsh-docker-services-proxy
    secrets:
      - proxy-auth-key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(fs.statSync('/run/dsh-docker-services-proxy/proxy.sock').isSocket()?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  controller-state: {}
  controller-run: {}
  audit-checkpoint: {}
  proxy-run: {}
secrets:
  proxy-auth-key:
    file: ./secrets/proxy-auth.key
  audit-checkpoint-key:
    file: ./secrets/audit-checkpoint.key
