services:
  controller:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    read_only: true
    restart: unless-stopped
    user: "1000:1000"
    network_mode: none
    volumes:
      - /var/run/docker.sock:/run/docker.sock:rw
      - ../controller.json:/etc/dsh-docker-services/controller.json:ro
      - controller-state:/var/lib/dsh-docker-services-volume
      - controller-run:/run/dsh-docker-services-volume
      - audit-checkpoint:/var/lib/dsh-audit-checkpoint-volume
    secrets:
      - proxy-auth-key
      - audit-checkpoint-key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(fs.statSync('/run/dsh-docker-services-volume/socket/controller.sock').isSocket()?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 12
  proxy:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    entrypoint: ["node", "packages/proxy/lib/src/main.js"]
    command: ["/etc/dsh-docker-services/proxy.json"]
    read_only: true
    restart: unless-stopped
    user: "1000:1000"
    network_mode: none
    volumes:
      - ../proxy.json:/etc/dsh-docker-services/proxy.json:ro
      - controller-run:/run/dsh-docker-services-volume:ro
      - proxy-run:/run/dsh-docker-services-proxy-volume
    secrets:
      - proxy-auth-key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(fs.statSync('/run/dsh-docker-services-proxy-volume/socket/proxy.sock').isSocket()?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  controller-state: {}
  controller-run: {}
  audit-checkpoint: {}
  proxy-run: {}
secrets:
  proxy-auth-key:
    file: ./secrets/proxy-auth.key
  audit-checkpoint-key:
    file: ./secrets/audit-checkpoint.key
